name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - name: Install nbb
        run: npm install -g nbb

      - name: Run tests
        run: clojure -M:test

      - name: Lint
        run: clojure -M:lint

      - name: Safe-release evidence gate (fixtures)
        run: nbb --classpath src scripts/check-safe-release.cljs

      - name: Safe-release evidence gate (strict release enforcement)
        run: nbb --classpath src scripts/check-safe-release.cljs --release --profile research

      - name: Key-register status (advisory)
        run: nbb --classpath src scripts/check-key-register.cljs

      - name: Crypto inventory gate
        run: nbb --classpath src scripts/check-crypto-inventory.cljs

      - name: Hybrid object-encryption admit gate
        run: nbb --classpath src scripts/check-hybrid-admit.cljs

      - name: Monitoring heartbeat (collector stub, file only)
        run: nbb --classpath src scripts/monitoring-heartbeat.cljs

      - name: Public-only key register gate
        run: bb scripts/check-key-register.bb

  # Recomputes the hybrid X25519 + ML-KEM-768 wrapping vectors with Bouncy
  # Castle (:vectors alias only; the gates job above stays BC-free).
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Hybrid KEM vector recomputation
        run: clojure -M:vectors:vectors-test

  # This repo defines the adoption contract every consumer's
  # `security-adoption.edn` is checked against, so a change to that contract can
  # be green here and leave every consumer failing.
  #
  # That is not hypothetical. adoption v3 (#61, 2026-07-20) added the
  # sensitive-operation inventory. No consumer migrated. kotoba-lang/kotoba went
  # red the moment its pin moved past that date, and kotoba-lang/kotoba-lang was
  # green only because its pin predated it -- a landmine, not a state.
  #
  # Verified before this job was written: running kotoba-lang's adoption check
  # against this checkout denies its pre-migration (v2) config and passes its
  # migrated one. So this job would have failed on #61, which is the point.
  consumer-adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: security
      - name: Check out a consumer
        run: git clone --depth 1 https://github.com/kotoba-lang/kotoba-lang kotoba-lang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: kotoba-lang adoption against this checkout
        working-directory: kotoba-lang
        run: |
          clojure -Sdeps "{:aliases {:dep {:override-deps {io.github.kotoba-lang/security {:local/root \"../security\"}}}}}" \
            -M:dep -m kotoba.security.adoption
