name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - name: Install nbb
        run: npm install -g nbb

      - name: Run tests
        run: clojure -M:test

      - name: Lint
        run: clojure -M:lint

      - name: Safe-release evidence gate (fixtures)
        run: nbb --classpath src scripts/check-safe-release.cljk

      - name: Safe-release evidence gate (strict release enforcement)
        run: nbb --classpath src scripts/check-safe-release.cljk --release --profile research

      - name: Key-register status (advisory)
        run: nbb --classpath src scripts/check-key-register.cljk

      - name: Crypto inventory gate
        run: nbb --classpath src scripts/check-crypto-inventory.cljk

      - name: Hybrid object-encryption admit gate
        run: nbb --classpath src scripts/check-hybrid-admit.cljk

      - name: Monitoring heartbeat (collector stub, file only)
        run: nbb --classpath src scripts/monitoring-heartbeat.cljk

      - name: Public-only key register gate
        run: bb scripts/check-key-register.bb

  # Recomputes the hybrid X25519 + ML-KEM-768 wrapping vectors with Bouncy
  # Castle (:vectors alias only; the gates job above stays BC-free).
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Hybrid KEM vector recomputation
        run: clojure -M:vectors:vectors-test

  # Kototama is a representative consumer for this inventory: its runtime
  # sources are `.cljk`, so this exercises the JVM verifier's source-only path
  # without loading Kototama namespaces into the JVM.
  #
  # The job checks Kototama's checked-in adoption config, dependency pin,
  # control edges, and sensitive-operation inventory against this checkout of
  # security. The local-root override selects this verifier source; the
  # verifier reads the consumer's on-disk `deps.edn` and `security-adoption.edn`.
  consumer-adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: security
      - name: Check out a consumer
        run: git clone --depth 1 https://github.com/kotoba-lang/kototama kototama
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Kototama source adoption against this checkout
        working-directory: kototama
        run: |
          clojure -Sdeps "{:aliases {:dep {:override-deps {io.github.kotoba-lang/security {:local/root \"../security\"}}}}}" \
            -M:dep -m kotoba.security.adoption
